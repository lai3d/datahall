<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GPU 机房搭建模拟器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<main id="stage">
  <div id="hud" aria-live="polite">
    <div><b id="hGpu">0</b><span>GPU</span></div>
    <div><b id="hIt">0 kW</b><span>IT 负载</span></div>
    <div><b id="hPue">–</b><span>PUE 估算</span></div>
  </div>
  <button id="camReset" type="button">重置视角</button>
</main>

<aside id="panel">
  <h1>GPU 机房搭建模拟器</h1>
  <p class="sub">选设备，点地板空位放置。拖动旋转视角，双指或滚轮缩放。</p>

  <h2>市电容量</h2>
  <div class="row seg" id="utility"></div>

  <h2>设备</h2>
  <div class="palette" id="palette"></div>

  <h2>容量检查</h2>
  <div id="gauges"></div>
  <ul class="issues" id="issues"></ul>
  <button id="power" type="button" disabled>通电</button>

  <h2>详情</h2>
  <div class="info" id="info"></div>

  <h2>预设场景</h2>
  <div class="row">
    <button type="button" data-preset="empty">清空机房</button>
    <button type="button" data-preset="gb200">GB200 集群</button>
    <button type="button" data-preset="rubin">Vera Rubin 一排</button>
  </div>

  <div id="usdBox" hidden>
    <h2>OpenUSD</h2>
    <div class="row">
      <button type="button" id="usdExport">导出 OpenUSD</button>
      <button type="button" id="usdImport">导入 .usda</button>
      <input type="file" id="usdFile" accept=".usda,.usd" hidden>
    </div>
    <p class="sub" id="usdMsg" style="margin-top:6px"></p>
    <ul class="issues" id="usdWarnings"></ul>
  </div>
  <p class="foot">功耗、价格为公开报道与供应链估算的粗略值，用于体验和教学，不可作为工程设计依据。Vera Rubin NVL72 功耗按 Max-Q 约 190 kW 计。</p>
</aside>

<script type="module" src="./src/main.js"></script>
</body>
</html>
