<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GPU data hall builder</title>
<meta name="description" content="Place GB300 and Vera Rubin NVL72 racks, then add the power, cooling and networking to switch them on. A browser simulator for AI data halls.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Social preview: crawlers need an absolute image URL, so it points at production. Regenerate with npm run social-images -->
<link rel="canonical" href="https://datahall.qfc.network/">
<meta property="og:url" content="https://datahall.qfc.network/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GPU data hall builder">
<meta property="og:title" content="GPU data hall builder">
<meta property="og:description" content="Place GB300 and Vera Rubin NVL72 racks, then add the power, cooling and networking to switch them on.">
<meta property="og:image" content="https://datahall.qfc.network/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A row of Vera Rubin NVL72 racks with CDUs, power panels and network racks in a 3D data hall">
<meta name="twitter:card" content="summary_large_image">
<!-- A theme chosen with the panel's switch (main.ts) applies before the first paint; without one the page follows the system -->
<script>try{var t=localStorage.getItem('datahall.theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<!-- The 3D view (scene.ts) and the React panel and overlay (ui.tsx) render into these.
     The panel is the main landmark: it holds the whole application, while the stage is only the 3D view it drives -->
<div id="stage"></div>
<main id="panel"></main>

<script type="module" src="./src/main.ts"></script>
</body>
</html>
