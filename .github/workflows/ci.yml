# Web 和 USD 工具链的自动检查。
# Unity 测试（tools/unity_test.sh、unity_build.sh）需要 Unity 许可证和 macOS，不在这里跑，改动 unity/ 时在本机运行。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  usd-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: LFS 文件已拉取
        run: tools/check_lfs.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      # 转换器测试会调用 web/scripts 做对照和 glTF-Validator 检查
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: pip install usd-core==26.8 jinja2
      - name: schema 生成文件没有过期
        run: PYTHON=$(which python) tools/gen_schema.sh -q --validate
      - name: 样例符合 schema
        run: python tools/validate_usd.py samples/datahall.usda
      - name: Python 测试（USD 校验、usda 转 Unity 布局包）
        run: python -m unittest discover -s tools -v
