# Automated checks for the web app and the USD toolchain.
# Unity tests (tools/unity_test.sh, unity_build.sh) need a Unity license and macOS, so they do not run here; run them locally when changing unity/.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  usd-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: LFS files are pulled
        run: tools/check_lfs.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      # The converter tests call web/scripts for comparison and glTF-Validator checks
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: pip install usd-core==26.8 jinja2
      - name: Generated schema files are up to date
        run: PYTHON=$(which python) tools/gen_schema.sh -q --validate
      - name: Sample conforms to the schema
        run: python tools/validate_usd.py samples/datahall.usda
      - name: Python tests (USD validation, usda to Unity layout bundle)
        run: python -m unittest discover -s tools -v
